name: Build Test

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-test:
    name: Test Build on ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-latest
            target: bun-windows-x64
            output: threadctl-test.exe
          - os: macos
            runner: macos-latest
            target: bun-darwin-arm64
            output: threadctl-test
          - os: linux
            runner: ubuntu-latest
            target: bun-linux-x64
            output: threadctl-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Test build
        run: bun build src/index.ts --compile --target=${{ matrix.target }} --outfile ${{ matrix.output }}

      - name: Test help command (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x ${{ matrix.output }}
          ./${{ matrix.output }} --help

      - name: Test help command (Windows)
        if: runner.os == 'Windows'
        run: .\${{ matrix.output }} --help
